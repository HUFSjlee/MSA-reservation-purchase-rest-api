server:
  port: 8081

spring:
  application:
    name: user-service

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://rds:3306/hufsjlee
    username: hufsjlee
    password: 123123

  jpa:
    database: mysql
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 1000
    defer-datasource-initialization: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          auth: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka

app:
  firebase-configuration-file: ${FIREBASE_CONFIG_FILE:./firebaseSecretKey.json}
  firebase-bucket: ${FIREBASE_BUCKET:reservationpurchase.appspot.com}

jwt:
  header: Authorization
  secret: ${JWT_SECRET:}
  token-validity-in-seconds: 86400
